Config:
  DB:
    Host: 127.0.0.1
    Port: 3306
    User: root
    Password: your_password
    DBName: trading
    # 连接池参数（留空或 <=0 即使用默认值：25 / 5 / 30）
    MaxOpenConns: 25
    MaxIdleConns: 5
    ConnMaxLifetimeMinutes: 30
  Worker:
    # 持久化回测/扫描任务的并发 Worker 数
    Count: 4
    # 任务租约与空队列轮询间隔
    LeaseSeconds: 30
    PollIntervalMillis: 250
    # 同步兼容接口等待异步任务完成的最长时间
    SyncWaitTimeoutSecs: 2
    # 单次扫描及全市场行情刷新的最大并发数
    ScanBatchSize: 8
