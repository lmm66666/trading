# Workbench configuration: use the same target database as the updater.
Config:
  Server:
    ListenAddress: 127.0.0.1:8080
  Updater:
    URL: http://nas.local:8081
    # Generate a random token (openssl rand -hex 32); use the same on both services.
    Token: replace_with_a_random_shared_token
  DB:
    Host: 127.0.0.1
    Port: 3306
    User: root
    Password: your_password
    DBName: trading
    # 连接池参数（留空或 <=0 即使用默认值：60 / 10 / 30）
    MaxOpenConns: 25
    MaxIdleConns: 5
    ConnMaxLifetimeMinutes: 30
  Worker:
    # 持久化回测/扫描任务的并发 Worker 数
    Count: 4
    # 任务租约与空队列轮询间隔
    LeaseSeconds: 30
    PollIntervalMillis: 250
    # 同步兼容接口等待异步任务完成的最长时间
    SyncWaitTimeoutSecs: 2
    # 单次扫描及全市场行情刷新的最大并发数
    ScanBatchSize: 8
